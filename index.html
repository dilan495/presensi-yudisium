<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kiosk Presensi Yudisium</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #fff;
      margin: 0;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 95vh;
    }
    .container { width: 100%; max-width: 550px; text-align: center; }
    .card { background: #1e293b; padding: 24px; border-radius: 16px; border: 1px solid #334155; box-shadow: 0 10px 30px rgba(0,0,0,0.5); position: relative; }
    
    input[type="password"] { width: 100%; max-width: 240px; padding: 12px; font-size: 20px; text-align: center; letter-spacing: 4px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: #fff; margin: 15px 0; }
    select { width: 100%; max-width: 280px; padding: 10px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: #fff; margin-bottom: 12px; font-size: 14px; }
    .btn { padding: 12px 24px; font-size: 16px; font-weight: bold; background: #2563eb; color: white; border: none; border-radius: 8px; cursor: pointer; }
    .btn:disabled { background: #475569; cursor: not-allowed; }
    
    .scanner-wrapper { position: relative; width: 100%; border-radius: 12px; overflow: hidden; background: #000; border: 3px solid #38bdf8; }
    #camera-preview { width: 100%; }

    #result-overlay {
      display: none;
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(15, 23, 42, 0.95);
      border-radius: 12px;
      padding: 24px;
      box-sizing: border-box;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      animation: fadeIn 0.2s ease-in-out;
      z-index: 10;
    }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    .res-title { font-size: 22px; font-weight: bold; margin-bottom: 15px; }
    .res-success { color: #4ade80; }
    .res-warning { color: #facc15; }
    .res-danger  { color: #f87171; }

    .res-card { width: 100%; background: #1e293b; padding: 16px; border-radius: 10px; border: 1px solid #475569; margin-top: 10px; }
    .res-row { display: flex; justify-content: space-between; font-size: 16px; margin: 6px 0; text-align: left; }
    .res-label { color: #94a3b8; }
    .res-val { font-weight: bold; color: #f8fafc; text-align: right; }
    .error-msg { color: #f87171; font-size: 14px; margin-top: 10px; display: none; }
  </style>
</head>
<body>

  <div class="container">
    <h2 style="color: #38bdf8; margin: 0 0 6px 0;">KIOSK PRESENSI YUDISIUM</h2>
    <p style="color: #94a3b8; margin: 0 0 16px 0;">Arahkan QR Code Tiket ke Kamera</p>

    <!-- FORM LOGIN PIN -->
    <div id="pin-section" class="card">
      <h3 style="margin-top:0;">Masukkan PIN Panitia:</h3>
      <input type="password" id="pin-input" placeholder="••••">
      <br>
      <button class="btn" id="btn-login" onclick="validasiDanNyalakanKamera()">Nyalakan Kamera</button>
      <div id="pin-error" class="error-msg"></div>
    </div>

    <!-- AREA SCANNER -->
    <div id="scanner-section" class="card" style="display: none; padding: 12px;">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 13px;">
        <span style="color: #38bdf8;" id="label-panitia">Petugas: -</span>
      </div>

      <!-- PILIHAN KAMERA TABLET/HP -->
      <select id="camera-select" onchange="gantiKamera()"></select>

      <div class="scanner-wrapper">
        <div id="camera-preview"></div>
        
        <div id="result-overlay">
          <div id="res-title" class="res-title"></div>
          <div class="res-card">
            <div class="res-row"><span class="res-label">Nama:</span> <span class="res-val" id="res-nama">-</span></div>
            <div class="res-row"><span class="res-label">NIM:</span> <span class="res-val" id="res-nim">-</span></div>
            <div class="res-row"><span class="res-label">Prodi:</span> <span class="res-val" id="res-prodi">-</span></div>
          </div>
        </div>
      </div>
      <p style="font-size: 12px; color: #94a3b8; margin: 8px 0 0 0;">Status: Kamera Aktif</p>
    </div>
  </div>

  <script>
    // ================== TEMPEL URL DEPLOY ANDA DI SINI ==================
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyx5DymnKMJu-fW99ZR_6N62oTOaCuuf3uryo3QKv1ZSNlSayKuozK3pPkBdFe4b00n/exec";
    // ====================================================================

    let activePin = "";
    let isProcessing = false;
    let html5QrEngine = null;

    function playBeep(isSuccess) {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.frequency.value = isSuccess ? 880 : 220;
        gain.gain.value = 0.15;
        osc.start();
        osc.stop(ctx.currentTime + (isSuccess ? 0.15 : 0.3));
      } catch (e) {}
    }

    function validasiDanNyalakanKamera() {
      const pin = document.getElementById('pin-input').value.trim();
      const errBox = document.getElementById('pin-error');
      const btn = document.getElementById('btn-login');

      if (!pin) {
        errBox.innerText = "Silakan masukkan PIN!";
        errBox.style.display = "block";
        return;
      }

      btn.disabled = true;
      btn.innerText = "Memeriksa PIN...";
      errBox.style.display = "none";

      fetch(`${WEB_APP_URL}?action=cek_pin&pin=${encodeURIComponent(pin)}`)
        .then(res => res.json())
        .then(data => {
          btn.disabled = false;
          btn.innerText = "Nyalakan Kamera";

          if (data.success) {
            activePin = pin;
            document.getElementById('label-panitia').innerText = "Petugas: " + data.namaPanitia;
            document.getElementById('pin-section').style.display = 'none';
            document.getElementById('scanner-section').style.display = 'block';
            muatDaftarKamera();
          } else {
            errBox.innerText = "❌ " + data.message;
            errBox.style.display = "block";
          }
        })
        .catch(err => {
          btn.disabled = false;
          btn.innerText = "Nyalakan Kamera";
          errBox.innerText = "❌ Gagal koneksi ke server.";
          errBox.style.display = "block";
        });
    }

    function muatDaftarKamera() {
      html5QrEngine = new Html5Qrcode("camera-preview", {
        experimentalFeatures: { useBarCodeDetectorIfSupported: true }
      });

      Html5Qrcode.getCameras().then(devices => {
        const select = document.getElementById('camera-select');
        select.innerHTML = '';
        if (devices && devices.length) {
          devices.forEach((device, index) => {
            const opt = document.createElement('option');
            opt.value = device.id;
            opt.text = device.label || `Kamera ${index + 1}`;
            select.appendChild(opt);
          });
          jalankanKamera(devices[0].id);
        } else {
          jalankanKamera({ facingMode: "user" });
        }
      }).catch(() => {
        jalankanKamera({ facingMode: "user" });
      });
    }

    function gantiKamera() {
      const select = document.getElementById('camera-select');
      if (html5QrEngine && html5QrEngine.isScanning) {
        html5QrEngine.stop().then(() => {
          jalankanKamera(select.value);
        });
      } else {
        jalankanKamera(select.value);
      }
    }

    function jalankanKamera(camConstraint) {
      html5QrEngine.start(
        camConstraint,
        { fps: 15, qrbox: { width: 280, height: 280 } },
        onScanSuccess,
        () => {}
      ).catch(err => alert("Izin kamera ditolak / Kamera tidak aktif: " + err));
    }

    function onScanSuccess(decodedText) {
      if (isProcessing) return;
      isProcessing = true;

      const overlay = document.getElementById('result-overlay');
      const title = document.getElementById('res-title');
      
      overlay.style.display = 'flex';
      title.className = 'res-title';
      title.innerText = "Memverifikasi NIM: " + decodedText + "...";

      fetch(`${WEB_APP_URL}?nim=${encodeURIComponent(decodedText)}&pin=${activePin}`)
        .then(res => res.json())
        .then(data => {
          if (data.status === "BERHASIL") {
            playBeep(true);
            title.classList.add('res-success');
            title.innerText = "✅ ABSENSI DITERIMA";
          } else if (data.status === "SUDAH_HADIR") {
            playBeep(false);
            title.classList.add('res-warning');
            title.innerText = "⚠️ SUDAH HADIR SEBELUMNYA";
          } else {
            playBeep(false);
            title.classList.add('res-danger');
            title.innerText = "❌ " + data.message;
          }

          document.getElementById('res-nama').innerText = data.nama || '-';
          document.getElementById('res-nim').innerText = data.nim || '-';
          document.getElementById('res-prodi').innerText = data.prodi || '-';

          setTimeout(() => {
            overlay.style.display = 'none';
            isProcessing = false;
          }, 3500);
        })
        .catch(err => {
          playBeep(false);
          title.classList.add('res-danger');
          title.innerText = "❌ Gagal Terhubung ke Database";
          setTimeout(() => {
            overlay.style.display = 'none';
            isProcessing = false;
          }, 3000);
        });
    }
  </script>
</body>
</html>
